<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>دفتر النصوص الرقمي — أحمد القندوسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --c-bg:#f5f3ec; --c-bg-2:#efece2; --c-card:#ffffff;
  --c-primary:#0b5c4f; --c-primary-2:#0e7a63; --c-primary-soft:#e6f2ef;
  --c-gold:#c9a227; --c-gold-soft:#fbf4dd;
  --c-text:#1f2937; --c-muted:#6b7280; --c-border:#e4dfd1;
  --c-shadow:0 10px 30px -12px rgba(11,92,79,.25);
  --c-shadow-sm:0 4px 14px -8px rgba(11,92,79,.28);
  --radius:18px; --radius-sm:12px;
  --c-h1:#0b5c4f; --c-h2:#b8860b; --c-h3:#1d4ed8; --c-p:#1f2937; --c-note:#7c2d12;
  --sidebar-w:290px;
}
html[data-mode="dark"]{
  --c-bg:#0f1720; --c-bg-2:#131d27; --c-card:#182430;
  --c-primary:#2dd4bf; --c-primary-2:#14b8a6; --c-primary-soft:#14302f;
  --c-gold:#e5c150; --c-gold-soft:#2b2513;
  --c-text:#e6edf3; --c-muted:#93a4b3; --c-border:#26333f;
  --c-shadow:0 10px 30px -12px rgba(0,0,0,.6);
  --c-shadow-sm:0 4px 14px -8px rgba(0,0,0,.6);
  --c-h1:#5eead4; --c-h2:#fbbf24; --c-h3:#93c5fd; --c-p:#e6edf3; --c-note:#fca5a5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--c-bg); color:var(--c-text); direction:rtl; overflow:hidden;
  line-height:1.7; font-size:15px; transition:background .3s,color .3s;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(201,162,39,.07) 0 2px, transparent 2px),
    radial-gradient(circle at 78% 62%, rgba(11,92,79,.06) 0 2px, transparent 2px),
    radial-gradient(circle at 45% 88%, rgba(201,162,39,.05) 0 2px, transparent 2px);
  background-size:60px 60px, 80px 80px, 100px 100px;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:10px;border:2px solid var(--c-bg)}
::-webkit-scrollbar-thumb:hover{background:var(--c-primary-2)}

body:not(.editing) [contenteditable]{caret-color:transparent;cursor:default}
body:not(.editing) [contenteditable]:focus{outline:none!important;background:transparent!important;box-shadow:none!important}
body:not(.editing) .block-tools,
body:not(.editing) .sig-add,
body:not(.editing) .week-tab .del-w,
body:not(.editing) .side-add,
body:not(.editing) .card-tools,
body:not(.editing) .lesson-tools,
body:not(.editing) .part-tools,
body:not(.editing) .row-actions,
body:not(.editing) .field-del,
body:not(.editing) .sig-card .sig-del,
body:not(.editing) .chip .del,
body:not(.editing) .nav-del,
body:not(.editing) .col-actions{display:none!important}

.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-primary-2) 100%);color:#fff;box-shadow:0 4px 20px -6px rgba(11,92,79,.5);position:relative;z-index:50;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.25);flex-shrink:0;backdrop-filter:blur(4px);overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-text strong{font-size:16px;font-weight:800;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text span{font-size:11.5px;opacity:.85;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:7px 12px;font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.25);transform:translateY(-1px)}
.tbtn.active{background:var(--c-gold);border-color:var(--c-gold);color:#1a1a1a}
.icon-btn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:19px;cursor:pointer;display:none;place-items:center;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.25)}
.layout{display:flex;flex:1;overflow:hidden;position:relative}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--c-card);border-inline-start:1px solid var(--c-border);overflow-y:auto;overflow-x:hidden;padding:16px 12px 60px;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:40}
.side-group{margin-bottom:18px}
.side-group-title{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--c-muted);text-transform:uppercase;padding:0 12px 8px;display:flex;align-items:center;gap:6px}
.side-group-title::after{content:"";flex:1;height:1px;background:var(--c-border)}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--c-text);transition:.18s;margin-bottom:2px;border:1px solid transparent;position:relative;user-select:none}
.nav-item:hover{background:var(--c-primary-soft);color:var(--c-primary)}
.nav-item.active{background:linear-gradient(135deg,var(--c-primary),var(--c-primary-2));color:#fff;box-shadow:var(--c-shadow-sm)}
.nav-item.active .nav-ico{background:rgba(255,255,255,.2);color:#fff}
.nav-ico{width:30px;height:30px;border-radius:9px;background:var(--c-primary-soft);color:var(--c-primary);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-size:10.5px;background:var(--c-gold-soft);color:var(--c-gold);padding:2px 7px;border-radius:20px;font-weight:800}
.nav-item.active .nav-count{background:rgba(255,255,255,.25);color:#fff}
.nav-del{opacity:0;width:22px;height:22px;border-radius:6px;border:none;background:rgba(220,38,38,.1);color:#dc2626;cursor:pointer;font-size:12px;display:grid;place-items:center;transition:.15s;flex-shrink:0}
.nav-item:hover .nav-del{opacity:1}
.nav-del:hover{background:#dc2626;color:#fff}
.side-add{width:100%;padding:9px;border-radius:12px;border:1.5px dashed var(--c-border);background:transparent;color:var(--c-muted);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.2s;display:none}
body.editing .side-add{display:block}
.side-add:hover{border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-soft)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s;z-index:35;backdrop-filter:blur(2px)}
.overlay.show{opacity:1;pointer-events:auto}
#themeOverlay{z-index:55}
.main{flex:1;overflow-y:auto;padding:26px 30px 100px;scroll-behavior:smooth;transition:background .3s,padding .3s}
.page{max-width:1180px;margin:0 auto;animation:fadeUp .35s ease;transition:all .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
body.a4-mode .main{background:#8a8a8a;background-image:none;padding:30px 20px 100px}
body.a4-mode::before{display:none}
body.a4-mode .page{width:210mm;max-width:210mm;min-height:297mm;background:var(--c-card);padding:18mm 16mm;border-radius:2px;box-shadow:0 8px 40px rgba(0,0,0,.35);margin:0 auto 24px}
body.a4-mode .home-header, body.a4-mode .page-head{border-radius:2px}
body.a4-mode .card, body.a4-mode .lesson{border-radius:8px}
body.a4-mode .official-page{border-radius:0;box-shadow:none}
@media (max-width: 900px){body.a4-mode .page{width:100%;max-width:100%;min-height:auto;padding:16px 12px}}
.home-header{background:var(--c-card);border-radius:var(--radius);padding:32px 30px 26px;margin-bottom:22px;box-shadow:var(--c-shadow);border:2px solid var(--c-gold);position:relative;overflow:hidden;text-align:center}
.home-header::before{content:"";position:absolute;top:0;inset-inline:0;height:6px;background:linear-gradient(90deg,var(--c-primary) 0%,var(--c-gold) 50%,var(--c-primary) 100%)}
.home-logo-wrap{position:relative;display:inline-block;margin-bottom:14px;transition:.25s;z-index:1}
body.editing .home-logo-wrap{cursor:pointer}
body.editing .home-logo-wrap:hover{transform:scale(1.03)}
.home-logo{width:110px;height:110px;object-fit:contain}
.home-org{position:relative;z-index:1;margin-bottom:14px}
.home-org > div{font-size:13px;color:var(--c-muted);outline:none;padding:2px 6px;border-radius:6px;display:inline-block;font-weight:600}
body.editing .home-org > div:focus{background:var(--c-gold-soft)}
.home-org .school-name{font-size:17px;font-weight:800;color:var(--c-primary);display:block;margin-top:4px}
.home-divider{height:2px;background:linear-gradient(90deg,transparent,var(--c-gold),transparent);margin:16px auto;max-width:380px;position:relative;z-index:1}
.home-doc-title{font-size:34px;font-weight:800;color:var(--c-primary);outline:none;display:inline-block;padding:4px 18px;border-radius:12px;position:relative;z-index:1;font-family:'Amiri',serif}
body.editing .home-doc-title:focus{background:var(--c-gold-soft)}
.home-subject{font-size:16px;font-weight:700;color:var(--c-gold);outline:none;margin-top:2px;position:relative;z-index:1;display:inline-block;padding:2px 12px;border-radius:8px}
body.editing .home-subject:focus{background:var(--c-gold-soft)}
.home-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:24px;position:relative;z-index:1;max-width:820px;margin-inline:auto}
.home-info-item{background:linear-gradient(135deg,var(--c-bg-2),var(--c-card));border:1px solid var(--c-border);border-radius:14px;padding:12px 16px;position:relative}
.home-info-item::before{content:"";position:absolute;top:0;inset-inline-start:0;width:4px;height:100%;background:var(--c-gold);border-radius:14px 0 0 14px}
.home-info-label{font-size:10.5px;font-weight:800;color:var(--c-muted);display:block;margin-bottom:3px}
.home-info-value{font-size:15px;font-weight:800;color:var(--c-text);outline:none;display:block;padding:2px 6px;border-radius:6px;min-height:22px}
body.editing .home-info-value:focus{background:var(--c-gold-soft)}
.page-head{background:var(--c-card);border-radius:var(--radius);padding:22px 26px;margin-bottom:22px;box-shadow:var(--c-shadow-sm);border:1px solid var(--c-border);position:relative;overflow:hidden}
.page-head::before{content:"";position:absolute;top:0;inset-inline-start:0;width:6px;height:100%;background:linear-gradient(180deg,var(--c-primary),var(--c-gold))}
.page-title{font-size:24px;font-weight:800;color:var(--c-primary);display:flex;align-items:center;gap:12px;outline:none;position:relative;z-index:1}
.page-title .ico{width:44px;height:44px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,var(--c-primary),var(--c-primary-2));color:#fff;display:grid;place-items:center;font-size:21px}
.page-sub{font-size:13px;color:var(--c-muted);margin-top:6px;position:relative;z-index:1}
.card{background:var(--c-card);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--c-shadow-sm);border:1px solid var(--c-border);position:relative}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--c-border);flex-wrap:wrap}
.card-head h3{font-size:17px;font-weight:800;color:var(--c-primary);outline:none;flex:1;min-width:120px}
.card-tools{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--c-border);background:var(--c-card);color:var(--c-muted);border-radius:9px;padding:5px 10px;font-size:11.5px;font-family:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.mini:hover{background:var(--c-primary-soft);color:var(--c-primary);border-color:var(--c-primary)}
.mini.danger:hover{background:#fee2e2;color:#dc2626;border-color:#dc2626}
.mini.gold:hover{background:var(--c-gold-soft);color:var(--c-gold);border-color:var(--c-gold)}
.mini.primary{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.block{position:relative;margin-bottom:10px;border-radius:12px;padding:2px 0}
body.editing .block:hover{background:var(--c-primary-soft);padding:6px 10px}
body.editing .block:hover .block-tools{opacity:1}
.block-tools{position:absolute;top:4px;inset-inline-start:6px;display:flex;gap:3px;opacity:0;z-index:5;background:var(--c-card);border-radius:9px;padding:3px;border:1px solid var(--c-border)}
.block-tools button{width:24px;height:24px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--c-muted);display:grid;place-items:center}
.block-text{outline:none;padding:5px 8px;border-radius:8px;word-wrap:break-word}
body.editing .block-text:focus{background:var(--c-gold-soft)}
.t-h1{font-size:22px;font-weight:800;color:var(--c-h1)}
.t-h2{font-size:17.5px;font-weight:700;color:var(--c-h2)}
.t-h3{font-size:15.5px;font-weight:700;color:var(--c-h3)}
.t-p{font-size:14.5px;color:var(--c-p);text-align:justify;line-height:1.95}
.t-note{font-size:13.5px;color:var(--c-note);background:var(--c-gold-soft);border-inline-start:4px solid var(--c-gold);border-radius:10px;padding:10px 14px}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--c-border);background:var(--c-card)}
table.dtable{width:100%;border-collapse:collapse;min-width:520px;font-size:13.5px}
table.dtable th{background:linear-gradient(135deg,var(--c-primary),var(--c-primary-2));color:#fff;padding:11px 12px;font-weight:700;text-align:center;font-size:13px}
table.dtable td{border-bottom:1px solid var(--c-border);border-inline-start:1px solid var(--c-border);padding:9px 12px}
table.dtable tbody tr:nth-child(even){background:var(--c-bg-2)}
table.dtable td [contenteditable]{outline:none;min-height:22px}
body.editing table.dtable td [contenteditable]:focus{background:var(--c-gold-soft);border-radius:4px}
.fields-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.field{background:var(--c-bg-2);border-radius:13px;padding:12px 15px;border:1px solid var(--c-border);position:relative}
.field-label{font-size:11px;font-weight:800;color:var(--c-muted);margin-bottom:3px}
.field-value{font-size:15px;font-weight:700;color:var(--c-text);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:linear-gradient(135deg,var(--c-primary),var(--c-primary-2));color:#fff;padding:9px 18px;border-radius:30px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.official-page{background:#fff;border-radius:var(--radius);border:2px solid #1e3a8a;margin-bottom:22px;color:#1f2937}
.official-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;font-size:12px;font-weight:700;background:#f3f4f6;border-bottom:1px solid #d1d5db}
.official-top .l{text-align:start}.official-top .c{text-align:center;color:#0b5c4f}.official-top .r{text-align:end}
.official-level-bar{background:linear-gradient(180deg,#fef9c3,#fde68a);text-align:center;padding:8px;font-size:14px;font-weight:800;color:#7c2d12;border-bottom:2px solid #b45309}
.official-badges{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:2px solid #1e3a8a}
.official-badges > div{padding:7px 6px;text-align:center;font-size:13px;font-weight:800;color:#fff}
.official-badges .b1{background:#1e40af}.official-badges .b2{background:#15803d}.official-badges .b3{background:#b91c1c}
.official-title-row{background:#1e3a8a;color:#fff;text-align:center;padding:9px;font-size:15px;font-weight:800}
.official-header-row{display:grid;grid-template-columns:1.1fr 2.2fr;background:#7c2d12;color:#fff;font-weight:800;font-size:13px;text-align:center}
.official-header-row > div{padding:8px}
.official-table{display:grid;grid-template-columns:1.1fr 2.2fr;border-bottom:2px solid #1e3a8a}
.official-table .left-col{border-inline-end:1px solid #d1d5db;padding:6px}
.official-table .right-col{padding:6px}
.official-row{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px dashed #cbd5e1;min-height:38px}
.official-row .lbl{background:#fef9c3;color:#78350f;font-weight:800;padding:3px 6px;border-radius:5px;text-align:center;font-size:11.5px}
.official-row .val{outline:none;min-height:22px;border-bottom:1px dotted #94a3b8;padding:2px 4px}
.official-content-area{min-height:220px;padding:8px 10px;outline:none;font-size:13.5px}
.official-foot{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #1e3a8a;background:#f9fafb}
.official-foot > div{padding:8px 12px;font-size:12.5px}
.official-foot .f-lbl{background:#b91c1c;color:#fff;font-weight:800;padding:3px 10px;border-radius:5px;font-size:11.5px;display:inline-block;margin-bottom:5px}
.official-foot .f-val{outline:none;min-height:32px;font-family:'Amiri',serif;font-size:16px;border-bottom:1px dotted #94a3b8}
.official-signs-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #d1d5db;background:#f3f4f6}
.official-signs-row > div{padding:8px;text-align:center;font-size:11.5px;font-weight:700}
.official-signs-row .sign-lbl{color:#0b5c4f;font-weight:800;display:block;margin-bottom:3px}
.official-signs-row .sign-val{font-family:'Amiri',serif;font-size:15px;outline:none;border-bottom:1px dotted #94a3b8;padding:2px 6px;display:inline-block;min-width:100px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:9px 20px;border-radius:30px;border:1.5px solid var(--c-border);background:var(--c-card);color:var(--c-muted);font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,var(--c-primary),var(--c-primary-2));color:#fff;border-color:transparent}
.lesson{background:var(--c-card);border-radius:var(--radius);margin-bottom:20px;border:1px solid var(--c-border);box-shadow:var(--c-shadow-sm);overflow:hidden}
.lesson-head{background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-primary-2) 100%);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lesson-num{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:14px}
.lesson-title{flex:1;font-size:16px;font-weight:700;outline:none}
.lesson-badge{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:20px;font-size:11.5px;font-weight:700}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:0}
.part{padding:18px 20px;position:relative}
.part+.part{border-inline-start:1px dashed var(--c-border)}
.part-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--c-gold-soft)}
.part-head h4{font-size:14px;font-weight:800;color:var(--c-gold);outline:none;flex:1}
.lesson-foot{padding:16px 20px;background:var(--c-bg-2);border-top:1px solid var(--c-border);display:flex;flex-direction:column;gap:12px}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sig-card{background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:11px 14px}
.sig-card .sig-label{font-size:11px;font-weight:800;color:var(--c-primary);margin-bottom:5px}
.sig-card .sig-value{font-family:'Amiri',serif;font-size:17px;color:var(--c-text);outline:none;border-bottom:1.5px dashed var(--c-border);min-height:24px}
.toast{position:fixed;bottom:24px;inset-inline-start:24px;z-index:200;background:var(--c-primary);color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:var(--c-shadow);transform:translateY(100px);opacity:0;transition:.35s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--c-card);border-radius:var(--radius-sm);padding:18px;border:1px solid var(--c-border);text-align:center}
.stat .num{font-size:28px;font-weight:800;color:var(--c-primary)}
.stat .lbl{font-size:12px;color:var(--c-muted);font-weight:700}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.quick{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:16px;cursor:pointer;display:flex;align-items:center;gap:11px}
.quick .qi{width:38px;height:38px;border-radius:11px;background:var(--c-primary-soft);display:grid;place-items:center;font-size:18px}
.drawer{position:fixed;top:0;right:0;height:100%;width:340px;background:var(--c-card);z-index:60;transform:translateX(105%);transition:transform .35s;display:flex;flex-direction:column;border-inline-end:1px solid var(--c-border)}
.drawer.open{transform:translateX(0)!important}
.drawer-head{padding:18px 20px;background:linear-gradient(135deg,var(--c-primary),var(--c-primary-2));color:#fff;display:flex;align-items:center;gap:10px}
.drawer-body{padding:18px 20px;overflow-y:auto;flex:1}
.color-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--c-border)}
.color-row label{flex:1;font-size:13.5px;font-weight:700}
.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.preset{height:44px;border-radius:12px;cursor:pointer;border:2px solid var(--c-border)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:none;place-items:center;padding:20px}
.modal.show{display:grid}
.modal-box{background:var(--c-card);border-radius:var(--radius);padding:24px;width:100%;max-width:440px}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="icon-btn" data-action="toggle-sidebar" title="القائمة">☰</button>
    <div class="brand">
      <div class="brand-logo" id="brandLogo">📖</div>
      <div class="brand-text">
        <strong contenteditable="true" data-bind="meta.docTitle" data-plain="true">دفتر النصوص</strong>
        <span contenteditable="true" data-bind="meta.subject" data-plain="true">مادة التربية الإسلامية</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button class="tbtn" data-action="toggle-edit" id="editBtn">✏️ <span class="txt">تحرير</span></button>
      <button class="tbtn" data-action="toggle-a4" id="a4Btn">📄 <span class="txt">A4</span></button>
      <button class="tbtn" data-action="open-theme">🎨 <span class="txt">الألوان</span></button>
      <button class="tbtn" data-action="toggle-mode">🌙 <span class="txt">الوضع</span></button>
      <button class="tbtn" data-action="manual-save">💾 <span class="txt">حفظ الآن</span></button>
      <button class="tbtn" data-action="export">⬇️ <span class="txt">تصدير</span></button>
      <button class="tbtn" data-action="import">⬆️ <span class="txt">استيراد</span></button>
      <button class="tbtn" data-action="print">🖨️ <span class="txt">طباعة</span></button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="overlay" id="overlay" data-action="toggle-sidebar"></div>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="drawer" id="themeDrawer">
  <div class="drawer-head">
    <h3 style="flex:1">🎨 تخصيص الألوان</h3>
    <button class="mini danger" data-action="close-theme">✕</button>
  </div>
  <div class="drawer-body">
    <div class="color-row"><label>العناوين H1</label><input type="color" id="col-h1"></div>
    <div class="color-row"><label>العناوين H2</label><input type="color" id="col-h2"></div>
    <div class="color-row"><label>العناوين H3</label><input type="color" id="col-h3"></div>
    <div class="color-row"><label>النص</label><input type="color" id="col-p"></div>
    <div class="color-row"><label>الملاحظات</label><input type="color" id="col-note"></div>
    <div class="preset-grid" id="presets"></div>
    <button class="mini danger" style="width:100%;margin-top:20px;padding:10px" data-action="reset-all">⚠️ حذف كل البيانات والبدء من جديد</button>
  </div>
</div>
<div class="overlay" id="themeOverlay" data-action="close-theme"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const DEFAULT_LOGO = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="95" fill="#0b5c4f"/><text x="100" y="115" text-anchor="middle" font-size="50" fill="white">📖</text></svg>`);

const DEFAULT_STATE = {
  version: 10,
  meta: {
    docTitle: 'دفتر النصوص', subject: 'مادة التربية الإسلامية',
    teacher: 'أحمد القندوسي',
    academy: 'الأكاديمية الجهوية للتربية والتكوين — فاس مكناس',
    direction: 'المديرية الإقليمية — تاونات',
    school: 'الثانوية الإعدادية بوهدوة',
    year: '2026 / 2027', level: 'السلك الثانوي الإعدادي',
    logo: DEFAULT_LOGO
  },
  theme: { h1:'#0b5c4f', h2:'#b8860b', h3:'#1d4ed8', p:'#1f2937', note:'#7c2d12', fontSize:15, mode:'light', a4mode:false },
  sections: [
    { id: 'sec-1', title: 'التوجيهات التربوية', icon: '📋', type: 'rich',
      blocks: [
        { id:'b1', type:'h1', html:'توجيهات تربوية' },
        { id:'b2', type:'p', html:'إن دفتر النصوص يعتبر وثيقة هامة تعكس عمل الأستاذ وصفا وتخطيطا وتنفيذا.' }
      ]
    },
    { id: 'sec-2', title: 'البطاقة الشخصية', icon: '👤', type: 'fields',
      fields: [
        { id:'f1', label:'الاسم الكامل', value:'أحمد القندوسي' },
        { id:'f2', label:'الإطار', value:'أستاذ التعليم الثانوي الإعدادي' },
        { id:'f3', label:'المادة المدرَّسة', value:'التربية الإسلامية' },
        { id:'f4', label:'المؤسسة', value:'الثانوية الإعدادية بوهدوة' },
        { id:'f5', label:'السنة الدراسية', value:'2026 / 2027' }
      ]
    },
    { id: 'sec-3', title: 'جدول الحصص', icon: '🕐', type: 'table',
      columns: ['اليوم', '08-09', '09-10', '10-11', '11-12'],
      rows: [
        ['الإثنين', '1APIC-1', '1APIC-2', '', ''],
        ['الثلاثاء', '', '', '3APIC-1', '3APIC-2'],
        ['الأربعاء', '1APIC-3', '1APIC-4', '', '']
      ]
    },
    { id: 'sec-4', title: 'تمرير الروائز', icon: '🎯', type: 'raawiz',
      level: 'السنة الأولى إعدادي', semester: 'الأسدوس الأول', subtitle: 'أسبوع التقويم',
      pageTitle: 'روائز الموضعة', rows: [{ cls:'1APIC-1', date:'2026-09-15' }],
      signature: 'ذ. أحمد القندوسي', notes: '', content: 'عناصر الاختبار التمهيدي'
    }
  ],
  levels: [
    { id: 'lvl-1', name: 'السنة الأولى إعدادي', icon: '1️⃣', semesters: [
      { id: 'sem-1', name: 'الأسدوس الأول', lessons: [
        { id: 'ls-1', num: '1', madkhal: 'التزكية', title: 'سورة ق (1-15)',
          parts: [{ id:'p1', title:'الحصة الأولى', blocks:[{ id:'pb1', type:'p', html:'مدارسة الآيات الكريمة' }] }],
          signatures: [{ label:'الأستاذ', value:'أحمد القندوسي' }]
        }
      ]}
    ]}
  ],
  ui: { view: { type: 'home' }, editing: false, semester: 0 }
};

const STORAGE_KEY = 'daftar_nusus_data_store';
let state = null;

function setPath(obj, path, val) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = /^\d+$/.test(parts[i]) ? +parts[i] : parts[i];
    if (cur[k] == null) cur[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    cur = cur[k];
  }
  const last = /^\d+$/.test(parts.at(-1)) ? +parts.at(-1) : parts.at(-1);
  cur[last] = val;
}

function toast(msg, icon = '✓') {
  const t = $('#toast');
  t.innerHTML = `<span>${icon}</span> ${esc(msg)}`;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

function persistData() {
  if (!state) return;
  try {
    const json = JSON.stringify(state);
    localStorage.setItem(STORAGE_KEY, json);
  } catch (e) {
    console.error('LocalStorage write error', e);
  }
}

function loadPersistedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') return parsed;
    }
  } catch (e) {
    console.error('LocalStorage read error', e);
  }
  return null;
}

function save(now = false) {
  persistData();
  if (now) toast('تم حفظ التعديلات بنجاح', '💾');
}

function applyTheme() {
  if (!state || !state.theme) return;
  const t = state.theme;
  const r = document.documentElement.style;
  r.setProperty('--c-h1', t.h1);
  r.setProperty('--c-h2', t.h2);
  r.setProperty('--c-h3', t.h3);
  r.setProperty('--c-p', t.p);
  r.setProperty('--c-note', t.note);
  document.body.style.fontSize = (t.fontSize || 15) + 'px';
  document.documentElement.setAttribute('data-mode', t.mode === 'dark' ? 'dark' : 'light');
  document.body.classList.toggle('a4-mode', !!t.a4mode);
  
  ['h1','h2','h3','p','note'].forEach(k => { 
    const i = $('#col-'+k); 
    if (i) i.value = t[k]; 
  });
}

function renderSidebar() {
  const sb = $('#sidebar');
  const v = state.ui.view;
  let html = `<div class="side-group">
    <div class="side-group-title">الرئيسية</div>
    <div class="nav-item ${v.type==='home'?'active':''}" data-nav='{"type":"home"}'>
      <div class="nav-ico">🏠</div><div class="nav-label">لوحة التحكم</div>
    </div>
  </div>
  <div class="side-group"><div class="side-group-title">الأقسام</div>`;
  
  state.sections.forEach(sec => {
    const active = v.type === 'section' && v.id === sec.id;
    html += `<div class="nav-item ${active?'active':''}" data-nav='${esc(JSON.stringify({type:'section', id:sec.id}))}'>
      <div class="nav-ico">${sec.icon||'📄'}</div>
      <div class="nav-label">${esc(sec.title)}</div>
    </div>`;
  });

  html += `</div><div class="side-group"><div class="side-group-title">المستويات</div>`;
  state.levels.forEach(lv => {
    const active = v.type === 'level' && v.id === lv.id;
    html += `<div class="nav-item ${active?'active':''}" data-nav='${esc(JSON.stringify({type:'level', id:lv.id}))}'>
      <div class="nav-ico">${lv.icon||'📘'}</div>
      <div class="nav-label">${esc(lv.name)}</div>
    </div>`;
  });
  html += `</div>`;
  sb.innerHTML = html;
}

function renderHome() {
  return `<div class="home-header">
    <img class="home-logo" src="${state.meta.logo || DEFAULT_LOGO}">
    <div class="home-org">
      <div contenteditable="true" data-bind="meta.academy" data-plain="true">${esc(state.meta.academy)}</div><br>
      <div contenteditable="true" data-bind="meta.direction" data-plain="true">${esc(state.meta.direction)}</div>
      <div class="school-name" contenteditable="true" data-bind="meta.school" data-plain="true">${esc(state.meta.school)}</div>
    </div>
    <div class="home-divider"></div>
    <div class="home-doc-title" contenteditable="true" data-bind="meta.docTitle" data-plain="true">${esc(state.meta.docTitle)}</div>
    <div class="home-info-grid">
      <div class="home-info-item"><span class="home-info-label">الأستاذ</span><span class="home-info-value" contenteditable="true" data-bind="meta.teacher" data-plain="true">${esc(state.meta.teacher)}</span></div>
      <div class="home-info-item"><span class="home-info-label">السنة الدراسية</span><span class="home-info-value" contenteditable="true" data-bind="meta.year" data-plain="true">${esc(state.meta.year)}</span></div>
    </div>
  </div>`;
}

function renderSection(id) {
  const sec = state.sections.find(s=>s.id===id);
  if (!sec) return '<div class="empty-hint">القسم غير موجود</div>';
  const idx = state.sections.indexOf(sec);
  const base = `sections.${idx}`;

  let body = '';
  if (sec.type === 'fields') {
    body = `<div class="card"><div class="fields-grid">${sec.fields.map((f, i)=>`
      <div class="field">
        <div class="field-label">${esc(f.label)}</div>
        <div class="field-value" contenteditable="true" data-bind="${base}.fields.${i}.value" data-plain="true">${esc(f.value)}</div>
      </div>`).join('')}</div></div>`;
  } else if (sec.type === 'table') {
    body = `<div class="card"><div class="table-wrap"><table class="dtable">
      <thead><tr>${sec.columns.map((c,ci)=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${sec.rows.map((r,ri)=>`<tr>${r.map((cell,ci)=>`<td><div contenteditable="true" data-bind="${base}.rows.${ri}.${ci}" data-plain="true">${esc(cell)}</div></td>`).join('')}</tr>`).join('')}</tbody>
    </table></div></div>`;
  } else if (sec.type === 'rich') {
    body = `<div class="card">${sec.blocks.map((b, bi)=>`
      <div class="block">
        <div class="block-text t-${b.type}" contenteditable="true" data-bind="${base}.blocks.${bi}.html">${b.html}</div>
      </div>`).join('')}</div>`;
  }
  return `<div class="page-head"><div class="page-title"><span class="ico">${sec.icon}</span><span>${esc(sec.title)}</span></div></div>${body}`;
}

function renderLevel(id) {
  const lv = state.levels.find(l=>l.id===id);
  if (!lv) return '<div class="empty-hint">المستوى غير موجود</div>';
  const li = state.levels.indexOf(lv);
  const sem = lv.semesters[0];
  return `<div class="page-head"><div class="page-title"><span class="ico">${lv.icon}</span><span>${esc(lv.name)}</span></div></div>
  ${sem.lessons.map((ls, lsi)=>`
    <div class="lesson">
      <div class="lesson-head">
        <div class="lesson-num">${ls.num}</div>
        <div class="lesson-title" contenteditable="true" data-bind="levels.${li}.semesters.0.lessons.${lsi}.title" data-plain="true">${esc(ls.title)}</div>
      </div>
      <div class="parts">${ls.parts.map((p, pi)=>`
        <div class="part">
          <div class="part-head"><h4>${esc(p.title)}</h4></div>
          ${p.blocks.map((b, bi)=>`<div class="block-text" contenteditable="true" data-bind="levels.${li}.semesters.0.lessons.${lsi}.parts.${pi}.blocks.${bi}.html">${b.html}</div>`).join('')}
        </div>`).join('')}
      </div>
    </div>`).join('')}`;
}

function renderMain() {
  const v = state.ui.view;
  let html = '';
  if (v.type === 'home') html = renderHome();
  else if (v.type === 'section') html = renderSection(v.id);
  else if (v.type === 'level') html = renderLevel(v.id);
  $('#main').innerHTML = `<div class="page">${html}</div>`;
}

function render() {
  applyTheme();
  renderSidebar();
  renderMain();
  document.body.classList.toggle('editing', !!state.ui.editing);
  const eb = $('#editBtn');
  if (eb) eb.classList.toggle('active', !!state.ui.editing);
}

document.addEventListener('input', e => {
  const el = e.target.closest('[data-bind]');
  if (!el) return;
  const bind = el.dataset.bind;
  const val = el.dataset.plain === 'true' ? el.textContent : el.innerHTML;
  setPath(state, bind, val);
  persistData(); // حفظ تلقائي لحظي مع كل حرف يُكتب
});

document.addEventListener('focusout', e => {
  if (e.target.closest('[contenteditable]')) {
    persistData();
  }
});

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    state.ui.view = JSON.parse(nav.dataset.nav);
    render();
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('show');
    return;
  }
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;

  if (a === 'toggle-sidebar') {
    $('#sidebar').classList.toggle('open');
    $('#overlay').classList.toggle('show');
  } else if (a === 'toggle-edit') {
    state.ui.editing = !state.ui.editing;
    persistData();
    render();
    toast(state.ui.editing ? 'وضع التحرير مفعّل' : 'وضع القراءة', state.ui.editing ? '✏️' : '🔒');
  } else if (a === 'manual-save') {
    save(true);
  } else if (a === 'open-theme') {
    $('#themeDrawer').classList.add('open');
    $('#themeOverlay').classList.add('show');
  } else if (a === 'close-theme') {
    $('#themeDrawer').classList.remove('open');
    $('#themeOverlay').classList.remove('show');
  } else if (a === 'toggle-mode') {
    state.theme.mode = state.theme.mode === 'dark' ? 'light' : 'dark';
    persistData();
    applyTheme();
  } else if (a === 'toggle-a4') {
    state.theme.a4mode = !state.theme.a4mode;
    persistData();
    applyTheme();
  } else if (a === 'print') {
    window.print();
  } else if (a === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a2 = document.createElement('a');
    a2.href = url;
    a2.download = `daftar-nusus-${Date.now()}.json`;
    a2.click();
    URL.revokeObjectURL(url);
  } else if (a === 'import') {
    $('#importFile').click();
  } else if (a === 'reset-all') {
    if (confirm('هل ترغب في إعادة ضبط المصنع ومسح كافة البيانات؟')) {
      localStorage.removeItem(STORAGE_KEY);
      state = structuredClone(DEFAULT_STATE);
      save();
      render();
      toast('تمت استعادة البيانات الأصلية', '♻️');
    }
  }
});

$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      state = JSON.parse(ev.target.result);
      save(true);
      render();
      toast('تم استيراد الدفتر بنجاح', '✅');
    } catch(err) {
      toast('ملف غير صالح', '⚠️');
    }
  };
  reader.readAsText(file);
});

// مستمعات حفظ الهاتف لمنع الضياع
window.addEventListener('pagehide', persistData);
window.addEventListener('beforeunload', persistData);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistData();
});

// الإقلاع النظيف بدون إعادة كتابة على البيانات المخزنة
(function init() {
  const saved = loadPersistedData();
  if (saved) {
    state = saved;
    // التأكد من استمرار العمل حتى لو فتح المتصفح على وضع القراءة
    state.ui.view = state.ui.view || { type: 'home' };
  } else {
    state = structuredClone(DEFAULT_STATE);
    persistData();
  }
  render();
})();
</script>
</body>
</html>
